name: 仓库离线检查

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: 静态检查
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 读取仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 规范化 Windows 临时目录
        shell: pwsh
        run: |
          $resolvedTemp = python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).resolve())'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the Windows runner temporary directory' }
          "TEMP=$resolvedTemp", "TMP=$resolvedTemp" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Python JSON 文档与文件指纹
        run: python scripts/check_repository.py
      - name: 公开源码内容检查
        run: |
          python scripts/test_public_content_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_public_content.py
      - name: 离线回归依赖
        run: python -m pip install -r scripts/requirements-tests.txt
      - name: PowerShell 语法
        shell: pwsh
        run: ./scripts/check_powershell.ps1
      - name: 源码安装的完整包发现与获取合同
        run: python scripts/test_turnkey_bundle.py --work local-artifacts/bootstrap-fixtures
      - name: 原生克隆回执与合批合同
        run: python scripts/test_native_clone_batch.py
      - name: 整页计划与回读合同
        run: python scripts/test_pro_page_plan.py
      - name: 假窗口目标与工具栏合同
        run: python scripts/test_pro_hwnd.py --work local-artifacts/hwnd-fixtures
      - name: 安装更新与入口合同
        run: python scripts/test_turnkey_delivery.py --work local-artifacts/delivery-fixtures
      - name: 发布附件索引和校验合同
        run: python scripts/test_turnkey_publisher_assets.py
      - name: Stu 在线客户端和回执合同
        run: python scripts/test_stu_native_client.py
      - name: 组布局定位数据流
        run: python scripts/test_native_group_layout.py
      - name: 多状态控件与图片资源
        run: python scripts/test_state_resources.py
      - name: 离线动画列表
        run: python scripts/test_offline_animation_edits.py
      - name: Pro 在线动画计划
        run: python scripts/test_pro_animation_plan.py
      - name: 离线格式适配
        run: python scripts/test_offline_adapters.py
      - name: Stu 基础工程工厂
        run: python scripts/test_stu_factory.py
      - name: 离线工程结构、策略、配方和图库
        run: python -m unittest discover -s scripts -p "test_offline_*.py"
      - name: 原厂诊断回执解析
        run: python scripts/test_native_check_result.py
      - name: 技能包与压缩内容校验
        run: python scripts/build_release.py --version v0.0.0-check --out local-artifacts/ci-release
      - name: 公开技能包内容检查
        run: python scripts/audit_public_content.py --zip local-artifacts/ci-release/mcgs-engineering-v0.0.0-check.zip
